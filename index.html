<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>CineLog AI - 观影记录</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-title" content="CineLog" />
  <link rel="icon" type="image/svg+xml" href="/logo-high-res.svg" />
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // 在生产环境/HTTPS 下启用 PWA 离线支持，开发环境自动注销以防缓存干扰
    if ('serviceWorker' in navigator) {
      if (window.location.protocol === 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(() => {
            console.log('[PWA] Service Worker registered successfully');
          }).catch((err) => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        });
      } else {
        // 本地开发模式下注销已有 SW，避免缓存导致样式异常
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) {
            reg.unregister();
            console.log('[PWA] Local dev mode: unregistering service worker');
          }
        });
      }
    }
  </script>
</body>

</html>
